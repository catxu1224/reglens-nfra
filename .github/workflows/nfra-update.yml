name: Update NFRA penalties

on:
  schedule:
    - cron: '0 1 * * *' # 09:00 Asia/Shanghai
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nfra-seed-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-nfra.txt
      - run: python -m pip install -r requirements-nfra.txt
      - run: python -m unittest discover -s tests -p 'test_nfra*.py'
      - name: Refresh official notices
        env:
          PYTHONIOENCODING: utf-8
        run: |
          if [ "$(TZ=Asia/Shanghai date +%d)" = "01" ]; then
            python scripts/nfra_incremental.py --since 2026-11-05
          else
            python scripts/nfra_incremental.py
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node scripts/seed.mjs --check
      - name: Publish changed seed
        run: |
          if git diff --quiet -- seeds/nfra_penalties_incremental.csv; then
            echo "No NFRA changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seeds/nfra_penalties_incremental.csv
          git commit -m "data: update NFRA penalty seed"
          git push
