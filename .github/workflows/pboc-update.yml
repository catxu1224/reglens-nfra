name: Update PBOC penalties
on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Daily refresh or continuous historical backfill
        type: choice
        options: [daily, backfill]
        default: daily
permissions:
  contents: write
  actions: write
concurrency:
  group: pboc-seed-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-nfra.txt
      - run: python -m pip install -r requirements-nfra.txt
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-writer
      - run: python -m unittest discover -s tests -p 'test_pboc*.py'
      - uses: actions/cache/restore@v4
        with:
          path: work/pboc
          key: pboc-fetch-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: pboc-fetch-
      - name: Refresh headquarters notices
        if: github.event_name != 'workflow_dispatch' || inputs.mode != 'backfill'
        timeout-minutes: 50
        continue-on-error: true
        id: headquarters
        run: |
          SINCE=$(TZ=Asia/Shanghai date -d '30 days ago' +%F)
          python scripts/pboc_incremental.py --since "$SINCE" --interval 60
      - name: Continue branch history and daily updates
        if: steps.headquarters.outcome != 'failure'
        id: branches
        continue-on-error: true
        run: python scripts/pboc_branches.py --max-requests 90 --max-minutes 100 --retry-failed
      - name: Verify full branch history
        if: always()
        env:
          HEADQUARTERS_OUTCOME: ${{ steps.headquarters.outcome }}
          BRANCHES_OUTCOME: ${{ steps.branches.outcome }}
        run: |
          if [ "$HEADQUARTERS_OUTCOME" = "failure" ] || [ "$BRANCHES_OUTCOME" != "success" ]; then
            rm -f seeds/pboc_complete_history.json
          else
            python scripts/pboc_validate_complete.py
          fi
      - name: Preserve crawl diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pboc-crawl-${{ github.run_id }}
          path: |
            seeds/pboc_penalties.csv
            seeds/pboc_notice_fields.json
            seeds/pboc_crawl_state.json
            config/pboc_branches.json
            work/pboc/issues.json
          if-no-files-found: ignore
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Validate the seed and completion proof
        run: |
          if [ -f seeds/pboc_complete_history.json ]; then
            node scripts/seed.mjs --regulator=pboc --require-complete --check
          else
            node scripts/seed.mjs --regulator=pboc --check
          fi
      - run: npm test
      - name: Save successful HTTP responses for resume
        if: always()
        uses: actions/cache/save@v4
        with:
          path: work/pboc
          key: pboc-fetch-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Publish seed
        run: |
          if [ -z "$(git status --porcelain -- seeds/pboc_penalties.csv seeds/pboc_notice_fields.json seeds/pboc_crawl_state.json config/pboc_branches.json seeds/pboc_complete_history.json)" ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add seeds/pboc_penalties.csv seeds/pboc_notice_fields.json seeds/pboc_crawl_state.json config/pboc_branches.json
          if [ -e seeds/pboc_complete_history.json ] || git ls-files --error-unmatch seeds/pboc_complete_history.json >/dev/null 2>&1; then
            git add -A -- seeds/pboc_complete_history.json
          fi
          git commit -m 'data: update PBOC penalty seed'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Continue unfinished historical batch
        if: steps.headquarters.outcome != 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python - <<'PYCONTINUE'
          import json, os, subprocess
          from pathlib import Path
          state=json.loads(Path('seeds/pboc_crawl_state.json').read_text())
          if state['queue'] and state.get('pause_reason') != 'blocked':
              subprocess.run(['gh','workflow','run','pboc-update.yml','--ref','main','-f','mode=backfill'],check=True)
              print('Next historical batch queued; the global rate clock is preserved.')
          else:
              print('No further batch queued; history is complete or failures require review.')
          PYCONTINUE
      - name: Report incomplete requests
        if: steps.headquarters.outcome == 'failure' || steps.branches.outcome == 'failure'
        run: |
          echo 'Some official requests failed. Successfully parsed notices and the checkpoint were preserved; see crawl diagnostics.'
          exit 1
